id: surfacescan360-missing-security-headers-medium

info:
  name: SurfaceScan360 Missing Security Headers Medium
  author: surfacescan360
  severity: low
  description: Detects missing common browser security headers on the target landing page.
  tags: exposure,headers,misconfig,surfacescan360

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: true
    max-redirects: 2
    stop-at-first-match: false
    matchers-condition: or
    matchers:
      - type: dsl
        name: missing-csp
        dsl:
          - '!contains(tolower(all_headers), "content-security-policy:")'
      - type: dsl
        name: missing-hsts
        dsl:
          - 'contains(tolower(BaseURL), "https://") && !contains(tolower(all_headers), "strict-transport-security:")'
      - type: dsl
        name: missing-x-frame-options
        dsl:
          - '!contains(tolower(all_headers), "x-frame-options:")'
      - type: dsl
        name: missing-x-content-type-options
        dsl:
          - '!contains(tolower(all_headers), "x-content-type-options:")'
