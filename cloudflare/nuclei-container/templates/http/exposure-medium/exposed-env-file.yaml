id: surfacescan360-exposed-env-file-medium

info:
  name: SurfaceScan360 Exposed Environment File Medium
  author: surfacescan360
  severity: high
  description: Checks whether a common environment file is publicly readable.
  tags: exposure,secrets,files,surfacescan360

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.env.local"
      - "{{BaseURL}}/.env.production"
    redirects: false
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        condition: or
        words:
          - "APP_KEY="
          - "APP_SECRET="
          - "DB_PASSWORD="
          - "DATABASE_URL="
          - "AWS_SECRET_ACCESS_KEY="
          - "SUPABASE_SERVICE_ROLE_KEY="
          - "OPENAI_API_KEY="
